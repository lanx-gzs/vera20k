name: Android (arm64)

# The sandbox this fork develops on has a 4 GB memory limit; the 0.4 core
# crate needs more than that to compile, so the debug APK is built here on a
# 16 GB runner instead of locally.

on:
  push:
    branches: [verazip, merge-0.4.1]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-26"

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ runner.android.sdk }}/ndk/28.2.13676358
          CARGO_PROFILE_FAST_OPT_LEVEL: 1
          CARGO_PROFILE_FAST_INCREMENTAL: false
        run: |
          cargo ndk -t arm64-v8a --platform 26 \
            -o android/app/src/main/jniLibs build --profile fast \
            -p vera20k-android --no-default-features --locked
        working-directory: android

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VeraZip-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
